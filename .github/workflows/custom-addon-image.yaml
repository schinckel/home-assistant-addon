name: Build custom ESPHome Device Builder app image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/custom-addon-image.yaml
      - esphome-dev-custom/**

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out add-on repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out backend with Packages editor changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: schinckel/device-builder
          ref: packages-editor
          path: build/device-builder

      - name: Check out frontend with Packages editor changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: schinckel/device-builder-frontend
          ref: packages-editor
          path: build/device-builder-frontend

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: build/device-builder-frontend/pnpm-lock.yaml

      - name: Build frontend wheel
        working-directory: build/device-builder-frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          python -m pip install build
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          backend = tomllib.loads(Path("../device-builder/pyproject.toml").read_text())
          requirement = next(
              dependency
              for dependency in backend["project"]["dependencies"]
              if dependency.startswith("esphome-device-builder-frontend==")
          )
          version = requirement.partition("==")[2]
          project = Path("pyproject.toml")
          source = project.read_text()
          updated, count = re.subn(r'(?m)^version = "0\.0\.0"$', f'version = "{version}"', source, count=1)
          if count != 1:
              raise SystemExit("Could not set the frontend wheel version")
          project.write_text(updated)
          PY
          python -m build --wheel

      - name: Build backend wheel
        working-directory: build/device-builder
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Stage wheels for image build
        run: |
          mkdir -p esphome-dev-custom/wheels
          cp build/device-builder/dist/*.whl esphome-dev-custom/wheels/
          cp build/device-builder-frontend/dist/*.whl esphome-dev-custom/wheels/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: esphome-dev-custom
          build-args: |
            BUILD_VERSION=2026.12.0-dev20261120.1
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/esphome-hassio-packages:latest
            ghcr.io/${{ github.repository_owner }}/esphome-hassio-packages:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/esphome-hassio-packages:2026.12.0-dev20261120.1
